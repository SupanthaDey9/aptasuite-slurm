# AptaSuite configuration template. Copy it, then edit the lines marked EDIT.
# Full reference: https://github.com/drivenbyentropy/aptasuite/wiki/The-configuration-file

### Experiment ###
Experiment.name = "SELEX against target X"
Experiment.description = "rounds 0, 3 and 6"
# EDIT: where AptaSuite stores its database and exports. Use a folder of its own:
# -parse wipes pooldata/, cycledata/, structuredata/, clusterdata/ and bppmdata/ inside it.
Experiment.projectPath = /path/to/my_projects/selex_target_x
# EDIT: 5' primer, and the 3' primer in 5'->3' direction of the aptamer.
# Both are required in AptaSuite 0.9.8: -parse fails without primer3, although the wiki
# calls it optional.
Experiment.primer5 = GGGAGGACGATGCGG
Experiment.primer3 = CAGACGACTCGCCCGA

### Selection cycles (EDIT: one block per sequenced round, in order) ###
SelectionCycle.name = R0
SelectionCycle.round = 0
SelectionCycle.isControlSelection = False
SelectionCycle.isCounterSelection = False

SelectionCycle.name = R3
SelectionCycle.round = 3
SelectionCycle.isControlSelection = False
SelectionCycle.isCounterSelection = False

SelectionCycle.name = R6
SelectionCycle.round = 6
SelectionCycle.isControlSelection = False
SelectionCycle.isCounterSelection = False

### Input reads (EDIT) ###
# One FASTQ (or .fastq.gz) per selection cycle, in the same order as the cycles above.
# For multiplexed or paired-end data see the "Importing HTS data" wiki page.
AptaplexParser.isPerFile = True
AptaplexParser.forwardFiles = /path/to/round_0.fastq.gz
AptaplexParser.forwardFiles = /path/to/round_3.fastq.gz
AptaplexParser.forwardFiles = /path/to/round_6.fastq.gz

### AptaCLUSTER ###
# EDIT: length of the randomized region. AptaCLUSTER silently skips every sequence whose
# randomized region has a different length.
Aptacluster.RandomizedRegionSize = 40
# EDIT: required, AptaSuite has no default. About 3/4 of RandomizedRegionSize (30 for 40 nt);
# it must be smaller than RandomizedRegionSize.
Aptacluster.LSHDimension = 30

### Export ###
# EDIT: cycles written by -export cycles and -export clusters. The names must match
# SelectionCycle.name above, or the export fails at the end of the job.
Export.Cycles = R0, R6

### Performance ###
# EDIT: set to the number of cores you ask Slurm for (-c).
Performance.maxNumberOfCores = 16
